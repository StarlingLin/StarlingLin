name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@master
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          # core
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Asia/Shanghai
          # isocalendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # languages
          plugin_languages: yes
          plugin_languages_ignored: Stylus, Swig, CSS, JavaScript, Jupyter Notebook
          plugin_languages_details: percentage, lines
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          # rss
          plugin_rss: yes
          plugin_rss_source: https://www.starlinglin.top/atom.xml
          plugin_rss_limit: 3
          # steam
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199239682272"
          plugin_steam_sections: player, most-played
          plugin_steam_games_ignored: 629520
          plugin_steam_achievements_limit: 1
